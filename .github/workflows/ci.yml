name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar flex y bison
        run: sudo apt-get update && sudo apt-get install -y flex bison gcc
      - name: Compilar
        run: make sintact
      - name: Pruebas
        run: bash tests/run.sh
